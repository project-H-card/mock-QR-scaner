<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>印刷用QRシート</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar"><a href="./">← 戻る</a><h1>印刷用シート</h1></header>
  <main>
    <section class="panel no-print">
      <p class="small">中身・誤り訂正レベル・サイズを変えた QR を並べています。1枚ずつ別の申込です。</p>
      <p class="small"><strong>印刷する時は、倍率を「100%（実際のサイズ）」にしてください。</strong>「用紙に合わせる」にすると、サイズが変わります。</p>
      <p class="small">読めなかった QR は、No. と「先頭」の6文字をメモしてください。スキャナの記録にも先頭の6文字が残ります。</p>
      <div class="row">
        <button id="print" class="primary grow">印刷する</button>
        <button id="regen" class="grow">作り直す</button>
      </div>
    </section>
    <div class="sheet" id="sheet"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="module" src="print.js"></script>
</body>
</html>
