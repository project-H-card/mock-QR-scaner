<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>受付スキャナ（mock）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar"><a href="./">← 戻る</a><h1>受付スキャナ</h1></header>
  <main>
    <div id="warn" class="warn" hidden></div>

    <div class="row">
      <button id="startBtn" class="primary grow">カメラを起動</button>
      <button id="stopBtn" class="grow" hidden>停止</button>
      <button id="torchBtn" hidden>ライト</button>
    </div>

    <div class="viewer" id="viewer">
      <video id="video" playsinline muted></video>
      <div class="viewer-msg" id="viewerMsg">「カメラを起動」を押してください</div>
    </div>

    <section class="result" id="result" aria-live="polite">
      <p class="muted">QR を枠の中に入れてください</p>
    </section>

    <section class="panel">
      <div class="stats">
        <div><strong id="statCount">0</strong><span>読み取り（今回）</span></div>
        <div><strong id="statFirst">—</strong><span>起動→最初</span></div>
        <div><strong id="statAvg">—</strong><span>平均の間隔</span></div>
      </div>
    </section>

    <details class="panel" id="settingsPanel">
      <summary>設定</summary>
      <label class="field">条件メモ（記録に残ります）
        <input type="text" id="memo" placeholder="例：iPhone SE・紙・30mm・暗め">
      </label>
      <label class="field">読み取りエンジン
        <select id="engine">
          <option value="qr-scanner">qr-scanner（標準）</option>
          <option value="zxing">ZXing（比較用）</option>
        </select>
      </label>
      <label class="field">カメラ
        <select id="camera"><option value="">背面カメラ（自動）</option></select>
      </label>
      <label class="check"><input type="checkbox" id="sound" checked> 音を鳴らす</label>
      <label class="check"><input type="checkbox" id="vibrate" checked> 振動する（Android のみ）</label>
      <pre class="env" id="env"></pre>
    </details>

    <section class="panel">
      <h2>記録</h2>
      <div class="row">
        <button id="copyBtn" class="primary grow">記録をコピー</button>
      </div>
      <div class="row">
        <button id="resetCheckins" class="grow">受付状態をリセット</button>
        <button id="clearLog" class="grow">記録を消す</button>
      </div>
      <p class="small muted" id="copyMsg"></p>
      <ol class="log" id="log"></ol>
    </section>
  </main>

  <script type="module" src="scan.js"></script>
</body>
</html>
