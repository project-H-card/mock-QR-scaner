<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>申込QR（mock）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar"><a href="./">← 戻る</a><h1>申込 QR（申込者の画面）</h1></header>
  <main>
    <section class="ticket">
      <p class="muted small">申込番号 <strong id="appNo"></strong></p>
      <div class="qr" id="qr"><img id="qrImg" alt="申込QR"></div>
      <p class="session" id="session"></p>
      <ul class="people" id="people"></ul>
      <p class="muted small">受付でこの QR を見せてください</p>
    </section>

    <div class="row">
      <button id="regen" class="primary grow">新しい QR にする</button>
      <button id="savePng" class="grow">画像として保存</button>
    </div>
    <p class="small muted">QR を長押ししても保存できます。保存した画像を写真アプリで表示して読めるかも試してください。</p>

    <section class="panel">
      <h2>表示の設定</h2>
      <label class="field">中身 <select id="mode"></select></label>
      <label class="field">誤り訂正レベル <select id="ecc"></select></label>
      <label class="field">表示サイズ
        <select id="size">
          <option value="100">大（画面幅いっぱい）</option>
          <option value="70">中</option>
          <option value="45">小</option>
        </select>
      </label>
      <p class="small muted" id="info"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="module" src="show.js"></script>
</body>
</html>
